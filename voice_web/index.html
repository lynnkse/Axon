<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>Axon Voice</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">PRIVATE · TAILNET</p>
    <h1>Axon Voice</h1>
    <p id="status" class="status" data-state="disconnected">Disconnected</p>
    <div class="controls">
      <button id="connect" type="button">Connect</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
    </div>
    <section aria-label="Conversation transcript">
      <h2>Transcript</h2>
      <div id="transcript" class="transcript" aria-live="polite"></div>
    </section>
    <audio id="remote-audio" autoplay></audio>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
