[program:cli]
command=python -u /opt/axon/container/pty_supervisor.py /opt/axon/cli_node.py
directory=/opt/axon
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/axon/cli.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
