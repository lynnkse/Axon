[program:manager]
command=python -u /opt/axon/session_manager.py
directory=/workspace
priority=10
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/axon/manager.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

