[program:web-cli-bridge]
command=python -u /opt/axon/web_cli_bridge.py
directory=/opt/axon
priority=30
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/axon/web-cli-bridge.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

