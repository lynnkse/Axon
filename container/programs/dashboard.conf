[program:dashboard]
command=streamlit run /opt/axon/dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
directory=/opt/axon
priority=30
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/axon/dashboard.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

